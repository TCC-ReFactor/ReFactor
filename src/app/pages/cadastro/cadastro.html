<html>

<body>

    <main class="login-page">
        <div class="login-shell">

            <!-- LADO ESQUERDO: FORMULÁRIO -->

            <div class="login-side">
                <div class="login-card">

                    <div class="login-tabs" role="tablist" aria-label="Autenticação">
                        <a class="login-tab" href="login.html" role="tab" aria-selected="false">Login</a>
                        <span class="login-tab is-active" role="tab" aria-selected="true"
                            aria-current="page">Cadastro</span>
                    </div>

                    <!-- Cadastro: Etapa 1 - dados pessoais -->

                    <form class="login-form" novalidate>
                        <input class="login-input" type="text" name="nome" placeholder="Nome:" autocomplete="name"
                            required />
                        <input class="login-input" type="email" name="email" placeholder="Email:" autocomplete="email"
                            required />
                        <input class="login-input" type="tel" name="celular" placeholder="Celular:" autocomplete="tel"
                            required />
                        <input class="login-input" type="text" name="documento" placeholder="CPF/CNPJ:" required />
                        <input class="login-input" type="password" name="senha" placeholder="Senha:"
                            autocomplete="new-password" required />

                        <div class="login-form-footer login-form-footer--end">
                            <a href="cadastro-endereco.html" class="btn btn-outline login-step-btn">Avançar</a>
                        </div>
                    </form>

                    <p class="login-note"><a href="../Frontend/index.html">Voltar para o início</a></p>
                </div>
            </div>

            <!-- LADO DIREITO: MARCA -->

            <div class="login-brand">
                <button id="theme-toggle" class="icon-btn login-brand-toggle" type="button"
                    aria-label="Alternar tema claro/escuro">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor"
                            stroke-width="1.6" stroke-linejoin="round" />
                    </svg>
                </button>
                <a href="../Frontend/index.html">
                    <img class="login-brand-logo" src="/public/img/Logo.png" alt="ReFactor logo" />
                </a>
            </div>

        </div>
    </main>

</body>

</html>
