<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar Lote</title>
    <link rel="stylesheet" href="lote.css" />
    <link rel="stylesheet" href="../../../../styles.css" />
    <link rel="stylesheet" href="../../feed/feed.css" />
</head>

<body>
    <div class="page-container">
        <header class="site-header site-header--app">

            <a href="step-1-ad.html" class="back-link" aria-label="Voltar para o feed">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <p>Cadastrar Lote</p>
            </a>

            <div class="site-header__actions">
                <button id="theme-toggle" class="icon-button" type="button" aria-label="Alternar tema claro/escuro">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor"
                            stroke-width="1.6" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
        </header>
        <main class="ad-create-page">

            <section class="ad-create__form-section">

                <form class="ad-create__form">

                    <div class="form-field">

                        <label for="lot-title">
                            <h2>Título do Lote</h2>
                        </label>

                        <input id="lot-title" type="text" placeholder="Ex: Notebooks Lenovo">

                    </div>

                    <div class="form-field">

                        <label for="lot-condition">
                            <h2>Condição</h2>
                        </label>

                        <select id="lot-condition">

                            <option>
                                Selecione
                            </option>

                            <option>
                                Novo
                            </option>

                            <option>
                                Seminovo
                            </option>

                            <option>
                                Usado
                            </option>

                        </select>

                    </div>

                    <div class="form-field">

                        <label for="lot-notes">
                            <h2>Observações</h2>
                        </label>

                        <textarea id="lot-notes">
                        </textarea>

                    </div>
                    <div class="form-actions">
                        <button class="previous-button" type="submit">
                            <a href="step-1-ad.html">Voltar</a>  
                        </button>
                        
                        <button class="next-button" type="submit">
                            <a href="step-3-item.html">Avançar</a>
                        </button>
                    </div>

                </form>

            </section>

            <aside class="ad-create__sidebar">
                <div class="stepper">

                    <div class="stepper__step is-active">

                        <div class="stepper__circle">
                            1
                        </div>

                        <p>
                            Cadastro
                            <br>
                            de Lote
                        </p>

                    </div>

                    <div class="stepper__line"></div>

                    <div class="stepper__step">

                        <div class="stepper__circle">
                            2
                        </div>

                        <p>
                            Cadastro
                            <br>
                            de Itens
                        </p>

                    </div>

                    <div class="stepper__line"></div>

                    <div class="stepper__step">

                        <div class="stepper__circle">
                            3
                        </div>

                        <p>
                            Cadastro de
                            <br>
                            Componentes
                        </p>

                    </div>

                </div>

            </aside>

            <div class="ad-create__accent-bar">

            </div>

        </main>

    </div>
</body>

</html>
