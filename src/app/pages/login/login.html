    <main class="login-page">
        <div class="login-shell">

            <!-- LADO ESQUERDO: FORMULÁRIO -->
            <div class="login-side">
                <div class="login-card">

                    <div class="login-tabs" role="tablist" aria-label="Autenticação">
                        <span class="login-tab is-active" role="tab" aria-selected="true"
                            aria-current="page">Login</span>
                        <a class="login-tab" routerLink="/cadastro-user" role="tab" aria-selected="false">Cadastro</a>
                    </div>

                    <!-- Formulário de Login -->

                    <form class="login-form" (ngSubmit)="submitLogin()">
                        <input class="login-input" type="text" name="login" placeholder="Login:" autocomplete="username"
                            [(ngModel)]="login" required />
                        <input class="login-input" type="password" name="senha" placeholder="Senha:"
                            autocomplete="current-password" [(ngModel)]="senha" required />

                        @if (errorMessage) {
                            <p class="login-error" role="alert">{{ errorMessage }}</p>
                        }

                        <div class="login-form-footer">
                            <a href="#" class="login-link">Esqueceu a senha?</a>
                            <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
                                {{ isSubmitting ? "Entrando..." : "Login" }}
                            </button>
                        </div>
                    </form>

                    <p class="login-note"><a routerLink="/index">Voltar para o início</a></p>
                </div>
            </div>

            <!-- LADO DIREITO: MARCA -->
            <div class="login-brand">
                <button id="theme-toggle" class="icon-btn login-brand-toggle" type="button"
                    aria-label="Alternar tema claro/escuro">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor"
                            stroke-width="1.6" stroke-linejoin="round" />
                    </svg>
                </button>
                <a routerLink="/index">
                    <img class="login-brand-logo" src="/img/refac_logo.png" alt="ReFactor logo" />
                </a>
            </div>
        </div>
    </main>
